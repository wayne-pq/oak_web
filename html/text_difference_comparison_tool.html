<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>JSON 文本差异对比</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- diff2html 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />

    <style>
        .textarea-row textarea {
            font-family: monospace;
            height: 220px;
            width: 100%;
            resize: vertical;
            tab-size: 4;
        }

        .card-body {
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }

        body {
            background: #f8f9fa;
        }

        #diff {
            overflow-x: auto;
        }
    </style>
</head>
<body>

<div class="container-fluid py-3">

    <!-- 顶部按钮 -->
    <div class="mb-3 d-flex gap-2">
        <button id="compareBtn" class="btn btn-primary">生成对比</button>
        <button id="openNewTabBtn" class="btn btn-outline-secondary">显示太小? 新标签页打开</button>
    </div>

    <!-- 输入区 -->
    <div class="row g-2 textarea-row mb-3">
        <div class="col-md-6">
            <label for="oldText" class="form-label fw-bold">左</label>
            <textarea id="oldText" class="form-control" placeholder="输入旧 JSON"></textarea>
        </div>
        <div class="col-md-6">
            <label for="newText" class="form-label fw-bold">右</label>
            <textarea id="newText" class="form-control" placeholder="输入新 JSON"></textarea>
        </div>
    </div>

    <!-- 对比结果 -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div id="diff"></div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<!-- jsdiff -->
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<!-- diff2html -->
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>

<script>
    const oldTextEl = document.getElementById('oldText');
    const newTextEl = document.getElementById('newText');
    const compareBtn = document.getElementById('compareBtn');
    const openNewTabBtn = document.getElementById('openNewTabBtn');
    const diffContainer = document.getElementById('diff');

    // 渲染 diff
    function renderDiff(oldStr, newStr) {
        const diffString = Diff.createTwoFilesPatch('Old', 'New', oldStr, newStr);
        const diffHtml = Diff2Html.html(diffString, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side'
        });
        diffContainer.innerHTML = diffHtml;
    }

    // 点击生成对比
    compareBtn.addEventListener('click', () => {
        renderDiff(oldTextEl.value, newTextEl.value);
    });

    // 新标签页打开
    openNewTabBtn.addEventListener('click', () => {
        const url = window.location.href.split('#')[0];
        window.open(url, '_blank');
    });

    // 支持 Tab 缩进
    function enableTabIndent(textarea) {
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.value = textarea.value.substring(0, start) + "\t" + textarea.value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + 1;
            }
        });
    }
    enableTabIndent(oldTextEl);
    enableTabIndent(newTextEl);

    // 实时对比更新（带节流）
    let timer;
    function refreshDiff() {
        clearTimeout(timer);
        timer = setTimeout(() => {
            renderDiff(oldTextEl.value, newTextEl.value);
        }, 500);
    }
    oldTextEl.addEventListener('input', refreshDiff);
    newTextEl.addEventListener('input', refreshDiff);

    // 默认示例 JSON
    const defaultOld = `{
  "name": "Alice",
  "age": 25,
  "hobbies": ["reading", "traveling", "swimming"]
}`;
    const defaultNew = `{
  "name": "Alice",
  "age": 26,
  "hobbies": ["reading", "traveling", "running"],
  "city": "Beijing"
}`;

    oldTextEl.value = defaultOld;
    newTextEl.value = defaultNew;
    renderDiff(defaultOld, defaultNew);
</script>

</body>
</html>
