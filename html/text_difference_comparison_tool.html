<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>JSON 文本差异对比</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- diff2html 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />

    <style>
        textarea {
            font-family: monospace;
            height: 180px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <!-- 顶部按钮 -->
    <div class="d-flex justify-content-start mb-3">
        <button id="compareBtn" class="btn btn-primary">生成对比</button>
    </div>

    <!-- 输入区 -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="oldText" class="form-label fw-bold">左 JSON</label>
            <textarea id="oldText" class="form-control" placeholder="输入 JSON"></textarea>
        </div>
        <div class="col-md-6">
            <label for="newText" class="form-label fw-bold">右 JSON</label>
            <textarea id="newText" class="form-control" placeholder="输入 JSON"></textarea>
        </div>
    </div>

    <!-- 对比结果 -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div id="diff"></div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<!-- jsdiff -->
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<!-- diff2html -->
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>

<script>
    const oldTextEl = document.getElementById('oldText');
    const newTextEl = document.getElementById('newText');
    const compareBtn = document.getElementById('compareBtn');
    const diffContainer = document.getElementById('diff');

    function renderDiff(oldStr, newStr) {
        const diffString = Diff.createTwoFilesPatch('Old', 'New', oldStr, newStr);
        const diffHtml = Diff2Html.html(diffString, {
            drawFileList: false,
            matching: 'lines',
            outputFormat: 'side-by-side'
        });
        diffContainer.innerHTML = diffHtml;
    }

    // 点击按钮生成对比
    compareBtn.addEventListener('click', () => {
        renderDiff(oldTextEl.value, newTextEl.value);
    });

    // 页面加载时默认 JSON 示例
    const defaultOld = `{
  "name": "Alice",
  "age": 25,
  "hobbies": ["reading", "traveling", "swimming"]
}`;
    const defaultNew = `{
  "name": "Alice",
  "age": 26,
  "hobbies": ["reading", "traveling", "running"],
  "city": "Beijing"
}`;

    oldTextEl.value = defaultOld;
    newTextEl.value = defaultNew;
    renderDiff(defaultOld, defaultNew);
</script>

</body>
</html>
