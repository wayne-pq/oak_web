<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON 格式化校验工具</title>

    <!-- Bootstrap 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JSONEditor 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.css" rel="stylesheet">

    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        #jsoneditor {
            height: 70vh; /* 占视口高度 70% */
            border: 1px solid #dee2e6;
            border-radius: .5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h4 class="mb-3">JSON 格式化校验工具</h4>

    <div class="d-flex gap-2 mb-3">
        <button id="formatBtn" class="btn btn-primary btn-sm">格式化</button>
        <button id="modeBtn" class="btn btn-secondary btn-sm">切换模式</button>
    </div>

    <div id="jsoneditor"></div>
</div>

<!-- 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.js"></script>

<script>
    const container = document.getElementById("jsoneditor");
    const options = {
        mode: "code",              // 默认代码模式
        modes: ["code", "tree"],   // 允许切换
        onError: function (err) {
            alert("JSON 错误: " + err.toString());
        }
    };

    const editor = new JSONEditor(container, options);

    // demo 初始内容
    editor.set({
        name: "示例",
        items: [1, 2, 3],
        nested: { a: true }
    });

    // 格式化（尝试解析并 set 回去）
    document.getElementById("formatBtn").onclick = function () {
        try {
            const json = editor.get();
            editor.set(json); // 重新 set 就会自动格式化
        } catch (e) {
            alert("无效 JSON: " + e.message);
        }
    };

    // 切换模式（code <-> tree）
    document.getElementById("modeBtn").onclick = function () {
        const currentMode = editor.getMode();
        const newMode = currentMode === "code" ? "tree" : "code";
        editor.setMode(newMode);
    };
</script>
</body>
</html>
