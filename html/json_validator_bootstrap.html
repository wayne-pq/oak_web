<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON 编辑器</title>

    <!-- Bootstrap 5.3.8 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JSONEditor 10.4.1 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.css" rel="stylesheet">

    <style>
        body {
            padding: 10px;
            background-color: #f8f9fa;
        }

        #errorBox {
            display: none;
            margin-bottom: 10px;
        }

        #jsoneditor {
            height: 80vh;
            border: 1px solid #dee2e6;
            border-radius: .5rem;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 错误提示栏 -->
    <div id="errorBox" class="alert alert-danger" role="alert"></div>

    <!-- 按钮栏 -->
    <div class="mb-2">
        <button id="formatToggleBtn" class="btn btn-primary">格式化/压缩</button>
        <button id="modeBtn" class="btn btn btn-secondary">切换模式</button>
        <button id="openNewTabBtn" class="btn btn-outline-secondary">显示太小? 新标签页打开</button>
    </div>

    <!-- JSON 编辑器 -->
    <div id="jsoneditor"></div>
</div>

<!-- JSONEditor 10.4.1 脚本 -->
<script src="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.js"></script>

<script>
    const errorBox = document.getElementById("errorBox");
    const container = document.getElementById("jsoneditor");
    const openNewTabBtn = document.getElementById('openNewTabBtn');
    const formatToggleBtn = document.getElementById('formatToggleBtn');

    const options = {
        mode: "code",
        modes: ["code", "tree"],
        onError: function (err) {
            errorBox.style.display = "block";
            errorBox.textContent = "JSON 错误: " + err.toString();
        },
        onChange: function () {
            try {
                editor.get();
                errorBox.style.display = "none";
            } catch (e) {
                errorBox.style.display = "block";
                errorBox.textContent = "JSON 错误: " + e.message;
            }
        }
    };

    const editor = new JSONEditor(container, options);

    // 初始内容
    editor.set({
        name: "示例",
        items: [1, 2, 3],
        nested: {a: true}
    });

    // 模式切换
    document.getElementById("modeBtn").onclick = function () {
        const currentMode = editor.getMode();
        const newMode = currentMode === "code" ? "tree" : "code";
        editor.setMode(newMode);
    };

    // 新开标签页
    openNewTabBtn.addEventListener('click', () => {
        const url = window.location.href.split('#')[0];
        window.open(url, '_blank');
    });

    // 压缩/格式化切换
    formatToggleBtn.addEventListener('click', () => {
        try {
            const json = editor.get();
            const currentText = editor.getText();

            // 判断当前是否为格式化状态（多行）
            const isPretty = currentText.includes('\n');
            const newText = isPretty
                ? JSON.stringify(json) // 压缩
                : JSON.stringify(json, null, 2); // 格式化

            editor.updateText(newText);
        } catch (e) {
            errorBox.style.display = "block";
            errorBox.textContent = "无法切换格式: " + e.message;
        }
    });
</script>
</body>
</html>
