<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON 编辑器</title>

    <!-- Bootstrap 5.3.8 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JSONEditor 10.4.1 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.css" rel="stylesheet">

    <style>
        body {
            padding: 10px;
            background-color: #f8f9fa;
        }
        #errorBox {
            display: none;
            margin-bottom: 10px;
        }
        #jsoneditor {
            height: 80vh; /* 占视口高度 80% */
            border: 1px solid #dee2e6;
            border-radius: .5rem;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <!-- 错误提示栏 -->
    <div id="errorBox" class="alert alert-danger" role="alert"></div>

    <!-- 切换模式按钮 -->
    <div class="mb-2">
        <button id="modeBtn" class="btn btn-primary btn-sm">切换模式</button>
    </div>

    <!-- JSON 编辑器 -->
    <div id="jsoneditor"></div>
</div>

<!-- JSONEditor 10.4.1 脚本 -->
<script src="https://cdn.jsdelivr.net/npm/jsoneditor@10.4.1/dist/jsoneditor.min.js"></script>

<script>
    const errorBox = document.getElementById("errorBox");
    const container = document.getElementById("jsoneditor");

    const options = {
        mode: "code",              // 默认代码模式
        modes: ["code", "tree"],   // 允许切换
        onError: function (err) {
            errorBox.style.display = "block";
            errorBox.textContent = "JSON 错误: " + err.toString();
        },
        onChange: function () {
            try {
                editor.get(); // 尝试获取 JSON
                errorBox.style.display = "none"; // 校验通过
            } catch (e) {
                errorBox.style.display = "block";
                errorBox.textContent = "JSON 错误: " + e.message;
            }
        }
    };

    const editor = new JSONEditor(container, options);

    // 初始内容
    editor.set({
        name: "示例",
        items: [1, 2, 3],
        nested: { a: true }
    });

    // 切换模式按钮
    document.getElementById("modeBtn").onclick = function () {
        const currentMode = editor.getMode();
        const newMode = currentMode === "code" ? "tree" : "code";
        editor.setMode(newMode);
    };
</script>
</body>
</html>
